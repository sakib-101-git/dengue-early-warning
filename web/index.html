<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dengue Watch: ward early warning</title>
  <meta name="description" content="Ward-level dengue risk 2 to 4 weeks ahead, from rainfall, temperature and humidity.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved / system theme before first paint (no flash).
    (function () {
      var t = null;
      try { t = localStorage.getItem("dw-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/echarts.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="?view=ward" data-nav="ward" aria-label="Dengue Watch home">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 2.6c3.3 4.3 6.6 8.1 6.6 11.7a6.6 6.6 0 0 1-13.2 0c0-3.6 3.3-7.4 6.6-11.7z" fill="currentColor"/><path d="M9 14.9a3 3 0 0 0 3 3" stroke="var(--brand-mark-ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </span>
        <span class="brand__name">Dengue Watch</span>
      </a>

      <nav class="seg seg--nav" aria-label="Views">
        <span class="seg__thumb" aria-hidden="true"></span>
        <a class="seg__item" href="?view=ward" data-nav="ward">Ward</a>
        <a class="seg__item" href="?view=city" data-nav="city">City</a>
        <a class="seg__item" href="?view=model" data-nav="model">Model</a>
        <a class="seg__item" href="?view=resources" data-nav="resources">Resources</a>
      </nav>

      <button class="icon-btn theme-toggle" type="button" aria-label="Switch to dark theme">
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="page" tabindex="-1">
    <div id="view" class="view" aria-live="polite"></div>
  </main>

  <footer class="foot">
    <span>Dengue Watch · LightGBM forecasts from weekly rainfall, temperature and humidity</span>
    <span>Runs fully offline · no external APIs</span>
  </footer>

  <noscript><p class="noscript">Dengue Watch needs JavaScript to show forecasts.</p></noscript>
</body>
</html>
